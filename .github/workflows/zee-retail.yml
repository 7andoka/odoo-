name: Zee Retail install check

on:
  push:
    paths:
      - "addons/zee_retail/**"
      - ".github/workflows/zee-retail.yml"
  pull_request:
    paths:
      - "addons/zee_retail/**"
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install zee_retail into a fresh Odoo database
        run: |
          # The official Odoo image reads HOST/USER/PASSWORD from the environment
          # and appends them after our arguments, so they must be set here.
          docker run --rm --network host \
            -e HOST=localhost -e PORT=5432 \
            -e USER=odoo -e PASSWORD=odoo \
            -v "$PWD/addons/zee_retail:/mnt/extra-addons/zee_retail:ro" \
            odoo:20.0 \
            odoo -d zee_test -i zee_retail --stop-after-init
